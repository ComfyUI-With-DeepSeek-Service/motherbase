  # Ollama сервис (deepseek)
  ollama:
    build:
      context: ./deepseek
      dockerfile: Dockerfile
    container_name: motherbase-ollama
    expose:
      - 11434
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./_vol_ollama-data_model:/root/.ollama/models
    restart: unless-stopped
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:11434"]
#      interval: 10s
#      timeout: 5s
#      retries: 5

#  # Backend сервис
  backend:
    build:
      context: ./backend_service
      dockerfile: Dockerfile
    container_name: motherbase-backend
    ports:
      - "8001:8000"
    depends_on:
      - ollama
    volumes:
      - backend_service:/app
    restart: unless-stopped

volumes:
  ollama-data:
  backend_service: