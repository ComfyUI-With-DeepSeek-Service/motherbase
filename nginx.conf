events {
    worker_connections 1024;  # Максимальное количество одновременных соединений на worker-процесс
}

http {
#     # Базовые настройки HTTP-модуля
#     include /etc/nginx/mime.types;  # Подключает стандартные MIME-типы файлов
#     default_type application/octet-stream;  # MIME-тип по умолчанию для неизвестных файлов
#     sendfile on;  # Включает оптимизированную отправку файлов через sendfile()
#     keepalive_timeout 65;  # Таймаут keep-alive соединений в секундах
#
#     # Общие настройки для проксирования
#     proxy_http_version 1.1;  # Использует HTTP/1.1 для прокси-соединений
#     proxy_set_header Host $host;  # Передает оригинальный Host-заголовок
#     proxy_set_header X-Real-IP $remote_addr;  # Передает реальный IP клиента
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Список проксированных IP
#     proxy_set_header X-Forwarded-Proto $scheme;  # Оригинальный протокол (http/https)
#     proxy_set_header Upgrade $http_upgrade;  # Необходимо для WebSocket-апгрейда
#     proxy_set_header Connection "upgrade";  # Необходимо для WebSocket-соединений

    # Определение upstream-сервера для балансировки нагрузки
    upstream ollama {
        server ollama:11434;  # Docker-сервис ollama на порту 11434
    }

    server {
        listen 80;  # Слушает на порту 80 (HTTP)
        server_name localhost;  # Имя сервера для виртуального хоста

        # Эндпоинт для проверки здоровья
        location /health {
            access_log off;  # Отключает логирование для этого пути
            add_header Content-Type text/plain;  # Устанавливает текстовый тип ответа
            return 200 "OK";  # Возвращает HTTP 200 с текстом "OK"
        }

        # Обработка всех запросов к /api/ollama
        location ~ ^/api/ollama(/.*)?$ {
            rewrite ^/api/ollama(/.*)$ $1 break;  # Удаляет префикс /api/ollama из URL
            proxy_pass http://ollama;  # Перенаправляет запросы на сервер ollama

            # Увеличенные таймауты для long-polling запросов LLM
            proxy_read_timeout 300s;  # Максимальное время чтения ответа
            proxy_send_timeout 300s;  # Максимальное время отправки запроса
        }

#         # Блокировка всех других путей
        location / {
            return 404 "Not Found\n";  # Возвращает HTTP 404 для всех других запросов
        }

        # Настройки логирования
        access_log /var/log/nginx/access.log;  # Файл лога доступа
        error_log /var/log/nginx/error.log;  # Файл лога ошибок
    }
}